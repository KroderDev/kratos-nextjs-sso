name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_ORY_SDK_URL: ""
  ORY_SDK_URL: ""
  NEXT_PUBLIC_ORY_PROJECT_NAME: CI
  ORY_PROJECT_API_TOKEN: ""
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npx vitest run --coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - run: pnpm build

  e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-e2e-

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  e2e-auth:
    name: E2E Auth Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_KRATOS_MODE: real
      PLAYWRIGHT_KRATOS_PORT: 4010
      KRATOS_COMPOSE_PROJECT: kratos-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      KRATOS_COMPOSE_FILE: tests/fixtures/kratos/docker-compose.yml

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-e2e-auth-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-e2e-auth-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-e2e-auth-

      - run: pnpm exec playwright install --with-deps chromium

      - name: Start real Kratos
        run: |
          docker compose \
            -p "$KRATOS_COMPOSE_PROJECT" \
            -f "$KRATOS_COMPOSE_FILE" \
            pull
          docker compose \
            -p "$KRATOS_COMPOSE_PROJECT" \
            -f "$KRATOS_COMPOSE_FILE" \
            run --rm kratos \
            -c /etc/config/kratos/kratos.yml migrate sql -e --yes
          docker compose \
            -p "$KRATOS_COMPOSE_PROJECT" \
            -f "$KRATOS_COMPOSE_FILE" \
            up -d kratos
          curl --fail --silent --show-error \
            --retry 60 --retry-delay 1 --retry-connrefused \
            "http://127.0.0.1:${PLAYWRIGHT_KRATOS_PORT}/health/ready"

      - run: pnpm test:e2e:auth

      - name: Show Kratos logs on failure
        if: failure()
        run: |
          docker compose \
            -p "$KRATOS_COMPOSE_PROJECT" \
            -f "$KRATOS_COMPOSE_FILE" \
            logs --no-color kratos || true

      - name: Stop real Kratos
        if: always()
        run: |
          docker compose \
            -p "$KRATOS_COMPOSE_PROJECT" \
            -f "$KRATOS_COMPOSE_FILE" \
            down --volumes --remove-orphans
