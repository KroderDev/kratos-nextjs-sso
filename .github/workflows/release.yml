name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example, v0.1.1)
        required: true
        default: v0.1.1
      next_public_app_url:
        description: Application origin (NEXT_PUBLIC_APP_URL)
        required: true
        default: ""
      next_public_brand_name:
        description: Brand name (NEXT_PUBLIC_BRAND_NAME)
        required: false
        default: "Your Platform"
      next_public_brand_mark:
        description: Brand mark (NEXT_PUBLIC_BRAND_MARK)
        required: false
        default: YP
      next_public_brand_logo_light:
        description: Light logo path (NEXT_PUBLIC_BRAND_LOGO_LIGHT)
        required: false
        default: /next.svg
      next_public_brand_logo_dark:
        description: Dark logo path (NEXT_PUBLIC_BRAND_LOGO_DARK)
        required: false
        default: /next-dark.svg
      next_public_brand_favicon_light:
        description: Light favicon path (NEXT_PUBLIC_BRAND_FAVICON_LIGHT)
        required: false
        default: ""
      next_public_brand_favicon_dark:
        description: Dark favicon path (NEXT_PUBLIC_BRAND_FAVICON_DARK)
        required: false
        default: ""
      next_public_ory_sdk_url:
        description: Ory SDK URL (NEXT_PUBLIC_ORY_SDK_URL)
        required: false
        default: ""
      next_public_ory_canonical_url:
        description: Optional canonical Ory URL (NEXT_PUBLIC_ORY_CANONICAL_URL)
        required: false
        default: ""
      next_public_ory_oauth_origins:
        description: OAuth authorization origins (NEXT_PUBLIC_ORY_OAUTH_ORIGINS)
        required: false
        default: ""
      next_public_ory_form_action_origins:
        description: Additional form-action and OAuth client redirect origins (NEXT_PUBLIC_ORY_FORM_ACTION_ORIGINS)
        required: false
        default: ""
      next_public_ory_project_name:
        description: Ory project name label (NEXT_PUBLIC_ORY_PROJECT_NAME)
        required: false
        default: ""
      next_public_ory_registration_enabled:
        description: Show the registration link (NEXT_PUBLIC_ORY_REGISTRATION_ENABLED)
        required: false
        default: "true"

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    env:
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || inputs.next_public_app_url || '' }}
      NEXT_PUBLIC_BRAND_NAME: ${{ vars.NEXT_PUBLIC_BRAND_NAME || inputs.next_public_brand_name || 'Your Platform' }}
      NEXT_PUBLIC_BRAND_MARK: ${{ vars.NEXT_PUBLIC_BRAND_MARK || inputs.next_public_brand_mark || 'YP' }}
      NEXT_PUBLIC_BRAND_LOGO_LIGHT: ${{ vars.NEXT_PUBLIC_BRAND_LOGO_LIGHT || inputs.next_public_brand_logo_light || '/next.svg' }}
      NEXT_PUBLIC_BRAND_LOGO_DARK: ${{ vars.NEXT_PUBLIC_BRAND_LOGO_DARK || inputs.next_public_brand_logo_dark || '/next-dark.svg' }}
      NEXT_PUBLIC_BRAND_FAVICON_LIGHT: ${{ vars.NEXT_PUBLIC_BRAND_FAVICON_LIGHT || inputs.next_public_brand_favicon_light || '' }}
      NEXT_PUBLIC_BRAND_FAVICON_DARK: ${{ vars.NEXT_PUBLIC_BRAND_FAVICON_DARK || inputs.next_public_brand_favicon_dark || '' }}
      NEXT_PUBLIC_ORY_SDK_URL: ${{ vars.NEXT_PUBLIC_ORY_SDK_URL || inputs.next_public_ory_sdk_url || '' }}
      NEXT_PUBLIC_ORY_CANONICAL_URL: ${{ vars.NEXT_PUBLIC_ORY_CANONICAL_URL || inputs.next_public_ory_canonical_url || '' }}
      NEXT_PUBLIC_ORY_OAUTH_ORIGINS: ${{ vars.NEXT_PUBLIC_ORY_OAUTH_ORIGINS || inputs.next_public_ory_oauth_origins || '' }}
      NEXT_PUBLIC_ORY_FORM_ACTION_ORIGINS: ${{ vars.NEXT_PUBLIC_ORY_FORM_ACTION_ORIGINS || inputs.next_public_ory_form_action_origins || '' }}
      NEXT_PUBLIC_ORY_PROJECT_NAME: ${{ vars.NEXT_PUBLIC_ORY_PROJECT_NAME || inputs.next_public_ory_project_name || 'Your Platform' }}
      NEXT_PUBLIC_ORY_REGISTRATION_ENABLED: ${{ vars.NEXT_PUBLIC_ORY_REGISTRATION_ENABLED || inputs.next_public_ory_registration_enabled || 'true' }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Docker login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate application origin
        run: |
          if [[ ! "$NEXT_PUBLIC_APP_URL" =~ ^https?://[^/]+$ ]]; then
            echo "NEXT_PUBLIC_APP_URL must be a valid origin (for example, https://example.com)" >&2
            echo "Set vars.NEXT_PUBLIC_APP_URL or pass inputs.next_public_app_url." >&2
            exit 1
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=raw,value=latest

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_BRAND_NAME=${{ env.NEXT_PUBLIC_BRAND_NAME }}
            NEXT_PUBLIC_BRAND_MARK=${{ env.NEXT_PUBLIC_BRAND_MARK }}
            NEXT_PUBLIC_BRAND_LOGO_LIGHT=${{ env.NEXT_PUBLIC_BRAND_LOGO_LIGHT }}
            NEXT_PUBLIC_BRAND_LOGO_DARK=${{ env.NEXT_PUBLIC_BRAND_LOGO_DARK }}
            NEXT_PUBLIC_BRAND_FAVICON_LIGHT=${{ env.NEXT_PUBLIC_BRAND_FAVICON_LIGHT }}
            NEXT_PUBLIC_BRAND_FAVICON_DARK=${{ env.NEXT_PUBLIC_BRAND_FAVICON_DARK }}
            NEXT_PUBLIC_ORY_SDK_URL=${{ env.NEXT_PUBLIC_ORY_SDK_URL }}
            NEXT_PUBLIC_ORY_CANONICAL_URL=${{ env.NEXT_PUBLIC_ORY_CANONICAL_URL }}
            NEXT_PUBLIC_ORY_OAUTH_ORIGINS=${{ env.NEXT_PUBLIC_ORY_OAUTH_ORIGINS }}
            NEXT_PUBLIC_ORY_FORM_ACTION_ORIGINS=${{ env.NEXT_PUBLIC_ORY_FORM_ACTION_ORIGINS }}
            NEXT_PUBLIC_ORY_PROJECT_NAME=${{ env.NEXT_PUBLIC_ORY_PROJECT_NAME }}
            NEXT_PUBLIC_ORY_REGISTRATION_ENABLED=${{ env.NEXT_PUBLIC_ORY_REGISTRATION_ENABLED }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign image
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
