version: v0.13.0

dsn: sqlite:///var/lib/sqlite/db.sqlite?_fk=true&_journal=WAL&mode=rwc

serve:
  public:
    base_url: http://127.0.0.1:4010/
  admin:
    base_url: http://127.0.0.1:4434/

selfservice:
  default_browser_return_url: http://127.0.0.1:3002/dashboard
  allowed_return_urls:
    - http://127.0.0.1:3002
    - http://127.0.0.1:3002/login
    - http://127.0.0.1:3002/registration
    - http://127.0.0.1:3002/recovery
    - http://127.0.0.1:3002/verification
    - http://127.0.0.1:3002/consent
    - http://127.0.0.1:3002/logout
    - http://127.0.0.1:3002/error
    - http://127.0.0.1:3002/dashboard
    - http://127.0.0.1:3002/dashboard/settings

  methods:
    password:
      enabled: true
    totp:
      enabled: true
      config:
        issuer: CI Kratos
    lookup_secret:
      enabled: true
    oidc:
      enabled: true
      config:
        providers:
          - id: e2e
            provider: generic
            client_id: e2e-client
            client_secret: e2e-secret
            issuer_url: http://127.0.0.1:4020
            mapper_url: file:///etc/config/kratos/oidc-mapper.jsonnet
            claims_source: userinfo
            scope:
              - email

  flows:
    error:
      ui_url: http://127.0.0.1:3002/error

    login:
      ui_url: http://127.0.0.1:3002/login
      lifespan: 10m

    registration:
      ui_url: http://127.0.0.1:3002/registration
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: session

    settings:
      ui_url: http://127.0.0.1:3002/dashboard/settings
      privileged_session_max_age: 15m

    recovery:
      enabled: false
      ui_url: http://127.0.0.1:3002/recovery

    verification:
      enabled: false
      ui_url: http://127.0.0.1:3002/verification

    logout:
      after:
        default_browser_return_url: http://127.0.0.1:3002/login

log:
  level: warning
  format: text
  leak_sensitive_values: false

secrets:
  cookie:
    - ci-only-cookie-secret-change-me-0123456789
  cipher:
    - 0123456789abcdef0123456789abcdef

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json
