version: v0.13.0

dsn: sqlite:///var/lib/sqlite/db.sqlite?_fk=true&_journal=WAL&mode=rwc

serve:
  public:
    base_url: http://127.0.0.1:4010/
  admin:
    base_url: http://127.0.0.1:4434/

selfservice:
  default_browser_return_url: http://127.0.0.1:3002/dashboard
  allowed_return_urls:
    - http://127.0.0.1:3002
    - http://127.0.0.1:3002/dashboard
    - http://127.0.0.1:3002/dashboard/settings

  methods:
    password:
      enabled: true

  flows:
    error:
      ui_url: http://127.0.0.1:3002/auth/error

    login:
      ui_url: http://127.0.0.1:3002/auth/login
      lifespan: 10m

    registration:
      ui_url: http://127.0.0.1:3002/auth/registration
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: session

    settings:
      ui_url: http://127.0.0.1:3002/dashboard/settings
      privileged_session_max_age: 15m

    recovery:
      enabled: false
      ui_url: http://127.0.0.1:3002/auth/recovery

    verification:
      enabled: false
      ui_url: http://127.0.0.1:3002/auth/verification

    logout:
      after:
        default_browser_return_url: http://127.0.0.1:3002/auth/login

log:
  level: warning
  format: text
  leak_sensitive_values: false

secrets:
  cookie:
    - ci-only-cookie-secret-change-me-0123456789
  cipher:
    - 0123456789abcdef0123456789abcdef

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json
